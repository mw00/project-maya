name: Speed report
description: Share how fast Maya runs on your PC
labels: ["speed-report"]
body:
  - type: markdown
    attributes:
      value: |
        Run `./maya.sh --bench` (Windows: `START-MAYA.bat --bench`), then `./maya.sh --report`, and attach `maya-report.txt`. It includes the benchmark.
  - type: input
    id: gpus
    attributes:
      label: GPUs, how many, and VRAM
      placeholder: 2x RTX 3090 24 GB
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
    validations:
      required: true
  - type: input
    id: ram
    attributes:
      label: RAM
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and quant
      placeholder: GLM-5.3-Flash, Maya-S
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context length
  - type: input
    id: prompt
    attributes:
      label: Prompt length (tokens)
  - type: input
    id: prefill
    attributes:
      label: Prefill (reading the prompt), tokens/s
    validations:
      required: true
  - type: input
    id: decode
    attributes:
      label: Decode (writing the answer), tokens/s
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maya version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command or config you used
      render: shell
  - type: textarea
    id: report
    attributes:
      label: maya-report.txt
      description: Drag the file here, or paste its text.

# Every push and pull request: the Python tests (server, installer, tools), the AMD build's CUDA-name check and the
# DeepSeek MXFP4 CPU tier tests - no GPU needed. The engine's CUDA build and its GPU tests run on the maintainers'
# V100s before a merge (CONTRIBUTING.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # llama.cpp's gguf-py at the commit the installer pins (setup.py LLAMA_CPP_COMMIT), where tools/_paths.py looks
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          sparse-checkout: gguf-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # a venv, as installs run: maya.py started from a system Python hands itself to ./maya.sh (os.execve)
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet numpy jinja2 regex pyyaml tqdm psutil 'jsonschema>=4.18,<5'
      - name: The AMD build's CUDA names all mapped (include/strata/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: GLM memory policy and RAM planner (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror tests/glm_memory_test.cpp -o "$RUNNER_TEMP/glm_memory_test"
          "$RUNNER_TEMP/glm_memory_test"
      - name: DeepSeek CPU row preparation (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror tests/ds4_cpu_prepare_rows_test.cpp -o "$RUNNER_TEMP/ds4_cpu_prepare_rows_test"
          "$RUNNER_TEMP/ds4_cpu_prepare_rows_test"
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -DDS4_CPU_PREPARE_STUB_TEST=1 tests/ds4_cpu_prepare_rows_test.cpp src/ds4/ds4_iq_cpu.cpp -o "$RUNNER_TEMP/ds4_cpu_prepare_stub_test"
          "$RUNNER_TEMP/ds4_cpu_prepare_stub_test"
      - name: DeepSeek MXFP4 CPU tiers (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off -Iinclude -pthread \
            -ffunction-sections -fdata-sections tests/ds4_mx_fma_test.cpp src/ds4/ds4_gguf_cpu.cpp \
            -Wl,--gc-sections -o "$RUNNER_TEMP/ds4_mx_fma_test"
          for s in 0 1; do for f in 0 1; do
            DS4_MX_SSSE3=$s DS4_MX_FAST_FMA=$f "$RUNNER_TEMP/ds4_mx_fma_test"
          done; done
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off -Iinclude -pthread \
            -ffunction-sections -fdata-sections tests/ds4_mx_ssse3_test.cpp src/ds4/ds4_gguf_cpu.cpp \
            -Wl,--gc-sections -o "$RUNNER_TEMP/ds4_mx_ssse3_test"
          # the runner's CPU has SSSE3: a 77 (no SSSE3) must fail here, not pass for a skipped run
          grep -q ssse3 /proc/cpuinfo
          "$RUNNER_TEMP/ds4_mx_ssse3_test"
          DS4_MX_SSSE3=1 DS4_MX_FAST_FMA=1 "$RUNNER_TEMP/ds4_mx_ssse3_test"
      - name: Server tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s serve -p "test_*.py" -t .'
      - name: Installer and tools tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tools -p "test_*.py"'

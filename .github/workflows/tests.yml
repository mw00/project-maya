# Every push and pull request: the Python tests (server, installer, tools) and the AMD build's CUDA-name check - no GPU
# needed. The engine's CUDA build and its GPU tests run on the maintainers' V100s before a merge (CONTRIBUTING.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # llama.cpp's gguf-py at the commit the installer pins (setup.py LLAMA_CPP_COMMIT), where tools/_paths.py looks
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 3cf03257f219afbe7334045ff7c6a06ac68c627d
          path: third_party/llama.cpp
          sparse-checkout: gguf-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # a venv, as installs run: maya.py started from a system Python hands itself to ./maya.sh (os.execve)
      - name: Python packages
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet numpy jinja2 regex pyyaml tqdm psutil 'jsonschema>=4.18,<5'
      - name: The AMD build's CUDA names all mapped (include/maya/hip_compat)
        run: '"$RUNNER_TEMP/venv/bin/python" tools/check_hip_compat.py'
      - name: GLM memory policy and RAM planner (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror tests/glm_memory_test.cpp -o "$RUNNER_TEMP/glm_memory_test"
          "$RUNNER_TEMP/glm_memory_test"
      - name: GLM MAYA_GLM_NO_REUSE boolean switch parsing (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -Iinclude -Itests/glm_dsa tests/glm_dsa/glm_no_reuse_test.cpp -o "$RUNNER_TEMP/glm_no_reuse_test"
          "$RUNNER_TEMP/glm_no_reuse_test"
      - name: GLM multi-NUMA startup diagnostics (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -Iinclude tests/glm_dsa/glm_numa_diag_test.cpp -o "$RUNNER_TEMP/glm_numa_diag_test"
          "$RUNNER_TEMP/glm_numa_diag_test"
      - name: DeepSeek CPU row preparation (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror tests/ds4_cpu_prepare_rows_test.cpp -o "$RUNNER_TEMP/ds4_cpu_prepare_rows_test"
          "$RUNNER_TEMP/ds4_cpu_prepare_rows_test"
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -DDS4_CPU_PREPARE_STUB_TEST=1 tests/ds4_cpu_prepare_rows_test.cpp src/ds4/ds4_iq_cpu.cpp -o "$RUNNER_TEMP/ds4_cpu_prepare_stub_test"
          "$RUNNER_TEMP/ds4_cpu_prepare_stub_test"
      - name: Ling slot-order regression, restore-point validation, NUMA & direct-read (CPU only)
        run: |
          c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Werror -pthread -Isrc/ling -Isrc/ds4 tests/ling_unit_test.cpp -o "$RUNNER_TEMP/ling_unit_test"
          "$RUNNER_TEMP/ling_unit_test"
      - name: Server tests
        # a hang prints every thread's stack (faulthandler, after 10 minutes, repeated) and ends the
        # step at 14 minutes instead of the job's 20 with nothing to read
        timeout-minutes: 14
        run: |
          cat > "$RUNNER_TEMP/run_server_tests.py" <<'PYEOF'
          import faulthandler, sys, unittest
          faulthandler.dump_traceback_later(600, repeat=True, file=sys.stderr)
          unittest.main(module=None, argv=["x", "discover", "-s", "serve", "-p", "test_*.py", "-t", ".", "-v"])
          PYEOF
          "$RUNNER_TEMP/venv/bin/python" -X faulthandler "$RUNNER_TEMP/run_server_tests.py" 2>&1 | tee "$RUNNER_TEMP/server-tests.log" | grep -vE "^\[maya\]" | cut -c1-300
          exit "${PIPESTATUS[0]}"
      - name: Installer and tools tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tools -p "test_*.py"'
